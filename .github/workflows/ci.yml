name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  coil:
    name: coil test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: coil-time

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          ref: main
          path: coil-lang

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libffi
        run: sudo apt-get update && sudo apt-get install -y libffi-dev

      - name: Build coil
        working-directory: coil-lang
        run: cargo build -p coil

      - name: Coil tests
        working-directory: coil-time
        run: make test
        env:
          COIL: ${{ github.workspace }}/coil-lang/target/debug/coil
